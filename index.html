<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>الاختبارات</title>
<script>try{document.documentElement.dataset.theme=localStorage.getItem("shafeei_theme")||"light"}catch(e){}</script>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
:root{--primary-color:#1b5e20;--primary-hover:#2e7d32;--bg-color:#f4f6f8;--card-bg:#fff;--text-color:#222;--border-color:#e0e0e0;--danger-color:#d32f2f;--danger-bg:#ffebee;--success-color:#2e7d32;--success-bg:#e8f5e9}
[data-theme=dark]{--bg-color:#0e1a12;--card-bg:#16221b;--text-color:#e6eee8;--border-color:#2b3f32;--danger-bg:#3b1a1a;--success-bg:#173b1d;--primary-color:#2e7d32;--primary-hover:#3a9440}
*{box-sizing:border-box}
body{margin:0;background:var(--bg-color);color:var(--text-color);font-family:'Segoe UI',Tahoma,Geneva,Verdana,sans-serif;direction:rtl;line-height:1.7}
.wrap{max-width:820px;margin:0 auto;padding:16px}
.card{background:var(--card-bg);border:1px solid var(--border-color);border-radius:14px;padding:16px;margin-bottom:14px;box-shadow:0 2px 8px rgba(0,0,0,.05)}
h1,h2,h3{color:var(--primary-color);margin:.2em 0}
input,textarea,select{width:100%;padding:10px;margin:6px 0;border:1px solid var(--border-color);border-radius:10px;background:var(--bg-color);color:var(--text-color);font:inherit}
textarea{min-height:70px;resize:vertical}
.btn{background:var(--primary-color);color:#fff;border:0;border-radius:10px;padding:10px 18px;font:inherit;font-weight:700;cursor:pointer}
.btn:hover{background:var(--primary-hover)}.btn:disabled{opacity:.5;cursor:not-allowed}
.btn.sm{padding:5px 11px;font-size:.85em}.btn.danger{background:var(--danger-color)}.btn.ghost{background:transparent;color:var(--primary-color);border:1px solid var(--primary-color)}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.sp{flex:1}
.opt{display:flex;gap:8px;align-items:center}.opt input[type=radio]{width:auto;flex:none;transform:scale(1.3)}
.badge{padding:2px 10px;border-radius:20px;font-size:.8em;background:var(--success-bg);color:var(--success-color)}.badge.off{background:var(--danger-bg);color:var(--danger-color)}
.muted{opacity:.7;font-size:.9em}.msg{padding:12px;border-radius:10px;background:var(--danger-bg);color:var(--danger-color);margin:8px 0}
.qtext{white-space:pre-wrap;font-weight:700;font-size:1.05em}.qimg{max-width:100%;border-radius:10px;margin:8px 0}
.choice{display:flex;gap:10px;align-items:center;padding:10px;margin:6px 0;border:1px solid var(--border-color);border-radius:10px;cursor:pointer}
.choice:has(input:checked){border-color:var(--primary-color);background:var(--success-bg)}.choice input{width:auto;margin:0;transform:scale(1.25)}
.timer{position:sticky;top:0;z-index:5;text-align:center;font-weight:800;font-size:1.2em;padding:8px;background:var(--card-bg);border-bottom:2px solid var(--primary-color)}
.big{font-size:3em;font-weight:800;color:var(--primary-color);text-align:center}
.center{text-align:center}
/* ===== شكل صفحة الطالب (نفس تصميم ملف الاختبار) ===== */
body.stu{font-family:'Cairo',sans-serif;background:#1e293b url('https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w1920') center/cover fixed;color:#fff;min-height:100vh;display:flex;flex-direction:column}
body.stu::before{content:"";position:fixed;inset:0;background:rgba(15,23,42,.85);z-index:-1}
body.stu .wrap{max-width:none;width:100%;flex:1;display:flex;flex-direction:column;padding:16px}
.stu-center{flex:1;display:flex;align-items:center;justify-content:center;width:100%}
.glass{background:rgba(255,255,255,.05);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border:1px solid rgba(255,255,255,.1);box-shadow:0 8px 32px rgba(0,0,0,.5);border-radius:1.5rem;padding:2rem;width:100%;max-width:56rem}
.glass.narrow{max-width:42rem;text-align:center}
.fade-in{animation:fadeInS .5s ease-out}
@keyframes fadeInS{from{opacity:0;transform:translateY(15px)}to{opacity:1;transform:translateY(0)}}
@keyframes pulseS{50%{opacity:.5}}
.stu-logo{width:8rem;height:8rem;margin:0 auto 1.2rem;border-radius:50%;border:4px solid #eab308;box-shadow:0 0 20px rgba(234,179,8,.4);overflow:hidden;background:#fff}
.stu-logo img{width:100%;height:100%;object-fit:cover}
.glass h1{color:#facc15;font-size:2rem;font-weight:700;margin:0 0 .3rem}
.glass h2{color:#e5e7eb;font-size:1.25rem;font-weight:600;margin:0 0 1.2rem}
.ex-title{color:#fff;font-size:1.5rem;font-weight:800;margin:.5rem 0}
.stu-name{font-size:1.25rem;margin:.5rem 0 1rem;color:#e5e7eb}.stu-name b{color:#facc15}
.stu-info{background:rgba(30,58,138,.5);border:1px solid rgba(96,165,250,.5);color:#dbeafe;padding:.75rem 1rem;border-radius:.5rem;margin-bottom:1.5rem;font-weight:700}
.stu-msg{background:rgba(127,29,29,.5);border:1px solid rgba(248,113,113,.5);color:#fecaca;padding:1rem;border-radius:.75rem;font-weight:700;margin-bottom:1rem}
.stu-btn{border:0;border-radius:.5rem;padding:.75rem 2rem;font:700 1.15rem 'Cairo',sans-serif;cursor:pointer;transition:all .2s;color:#111827}
.stu-btn.gold{background:#eab308;box-shadow:0 4px 15px rgba(234,179,8,.3)}.stu-btn.gold:hover{background:#facc15}
.stu-btn.green{background:#22c55e;color:#fff}.stu-btn.green:hover{background:#4ade80}
.stu-btn.gray{background:#374151;color:#fff}.stu-btn.gray:hover{background:#4b5563}
.stu-btn.big{width:100%;font-size:1.5rem;padding:1rem}.stu-btn.big:hover{transform:scale(1.05)}.stu-btn:disabled{opacity:.5;cursor:not-allowed}
.q-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:1.5rem;padding-bottom:1rem;border-bottom:1px solid rgba(255,255,255,.1)}
.q-num{font-size:1.2rem;font-weight:700;background:rgba(255,255,255,.1);padding:.5rem 1rem;border-radius:.5rem;color:#e5e7eb}.q-num b{color:#facc15}
.mot{flex:1;text-align:center;font-size:1.2rem;font-weight:700;color:#4ade80}
.q-body{min-height:250px;display:flex;flex-direction:column;justify-content:center;margin-bottom:1.5rem}
.q-text{font-size:1.8rem;font-weight:800;line-height:1.6;text-align:center;margin:0 0 1.5rem;white-space:pre-wrap}
.q-img{display:block;max-width:100%;max-height:300px;margin:0 auto 1.2rem;border-radius:.75rem}
.q-opts{width:100%;max-width:42rem;margin:0 auto}
.q-opt{display:block;width:100%;text-align:right;padding:1rem;margin:.6rem 0;border-radius:.5rem;background:rgba(255,255,255,.08);border:2px solid rgba(255,255,255,.1);font:600 1.25rem 'Cairo',sans-serif;color:#fff;cursor:pointer;transition:all .2s}
.q-opt:hover{background:rgba(255,255,255,.15);transform:translateY(-2px)}
.q-opt.sel{background:#10b981;border-color:#34d399;transform:scale(1.02);box-shadow:0 4px 15px rgba(16,185,129,.3)}
.q-foot{display:flex;align-items:center;padding-top:1.2rem;border-top:1px solid rgba(255,255,255,.1)}
.tm-wrap{position:relative;width:70px;height:70px}.tm-svg{transform:rotate(-90deg);width:70px;height:70px}
.tm-bg{fill:none;stroke:rgba(255,255,255,.2);stroke-width:8}
.tm-fg{fill:none;stroke:#facc15;stroke-width:8;stroke-dasharray:283;stroke-dashoffset:0;transition:stroke-dashoffset 1s linear,stroke .5s}
.tm-txt{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;font-weight:700;font-size:.85rem}
.tm-txt.red{color:#f87171;animation:pulseS 1s infinite}
.res-circle{width:10rem;height:10rem;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:3rem;font-weight:900;margin:1rem auto;border:8px solid;box-shadow:0 0 30px rgba(0,0,0,.5)}
.res-circle.ok{border-color:#22c55e;color:#4ade80;background:rgba(20,83,45,.3)}.res-circle.no{border-color:#ef4444;color:#f87171;background:rgba(127,29,29,.3)}
.stu-foot{text-align:center;padding:1rem 0;font-size:.95rem;color:#d1d5db;opacity:.85}.stu-foot span{color:#facc15;font-weight:600}
/* ===== مراجعة الإجابات ===== */
.rv-item{background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);border-radius:1rem;padding:1rem;margin:1rem 0;text-align:right}
.rv-item.bad{border-color:rgba(248,113,113,.6)}.rv-item.ok{border-color:rgba(74,222,128,.5)}
.rv-h{display:flex;justify-content:space-between;font-weight:800;color:#facc15;margin-bottom:.4rem}
.rv-q{font-size:1.25rem;font-weight:700;white-space:pre-wrap;margin-bottom:.8rem}
.rv-opt{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:.7rem 1rem;margin:.4rem 0;border-radius:.5rem;background:rgba(255,255,255,.06);border:2px solid rgba(255,255,255,.1);font-weight:600}
.rv-opt.right{background:rgba(34,197,94,.2);border-color:#22c55e;color:#bbf7d0}
.rv-opt.wrong{background:rgba(239,68,68,.2);border-color:#ef4444;color:#fecaca}
.rv-tag{font-size:.8rem;font-weight:800;white-space:nowrap}
.rv-bar{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;margin:1rem 0}
.swal2-popup{font-family:'Cairo',sans-serif!important;border-radius:1rem!important}
@media(max-width:640px){.glass{padding:1.2rem}.mot{display:none}.q-text{font-size:1.4rem}.q-opt{font-size:1.1rem}.q-head{justify-content:space-between}}
</style>
</head>
<body><div class="wrap" id="app"><div class="card center">جاري التحميل...</div></div>
<script>
const API = 'https://script.google.com/macros/s/AKfycbzweziUL7Q3o62k-Ci16kbHho1EWseeXbZlbC4X3SC61KsVrQenlrUMCGoDrG1u1zvWRg/exec';   // رابط Web App الخاص بـ Code.gs (ينتهي بـ /exec)
const $ = id => document.getElementById(id);
const esc = s => String(s == null ? '' : s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
let PASS = sessionStorage.getItem('ex_pass') || '', Q = [], EDIT_ID = '';

async function api(b) {
  try {
    const r = await fetch(API, { method: 'POST', headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(Object.assign({ pass: PASS }, b)) });
    return await r.json();
  } catch (e) { return { status: 'error', message: 'تعذر الاتصال بالسيرفر' }; }
}
const view = h => $('app').innerHTML = h;

function loginView(m) {
  view(`<div class="card center"><h2>🔐 لوحة تحكم الاختبارات</h2>
  <input type="password" id="pw" placeholder="كلمة سر المطور" onkeydown="if(event.key==='Enter')login()">
  ${m ? `<div class="msg">${esc(m)}</div>` : ''}<button class="btn" onclick="login()">دخول</button></div>`);
}
async function login() {
  PASS = $('pw').value; const r = await api({ action: 'list' });
  if (r.status !== 'ok') return loginView(r.message);
  sessionStorage.setItem('ex_pass', PASS); listView(r.exams);
}
function examUrl(id) { return location.origin + location.pathname + '?id=' + id; }

async function home() {
  const r = await api({ action: 'list' });
  if (r.status !== 'ok') { sessionStorage.removeItem('ex_pass'); return loginView(r.message); }
  listView(r.exams);
}
function listView(ex) {
  view(`<div class="row"><h1>📝 الاختبارات</h1><span class="sp"></span><button class="btn" onclick="editor()">+ اختبار جديد</button></div>
  ${ex.length ? ex.map(e => `<div class="card"><div class="row"><h3>${esc(e.title)}</h3>
    <span class="badge ${e.status === 'مفعل' ? '' : 'off'}">${esc(e.status)}</span><span class="sp"></span>
    <span class="muted">${e.count} سؤال • ${e.minutes ? e.minutes + ' دقيقة' : 'بدون مؤقت'}</span></div>
    <input readonly value="${esc(examUrl(e.id))}" onclick="this.select()">
    <div class="row"><button class="btn sm" onclick="copy('${e.id}')">نسخ الرابط</button>
    <button class="btn sm ghost" onclick="editor('${e.id}')">تعديل</button>
    <button class="btn sm ghost" onclick="tg('${e.id}')">${e.status === 'مفعل' ? 'إيقاف' : 'تفعيل'}</button>
    <button class="btn sm danger" onclick="del('${e.id}')">حذف</button></div></div>`).join('') : '<div class="card center muted">لا توجد اختبارات بعد</div>'}`);
}
function copy(id) { navigator.clipboard.writeText(examUrl(id)).then(() => alert('تم نسخ الرابط ✅')); }
async function tg(id) { await api({ action: 'toggle', id }); home(); }
async function del(id) { if (confirm('حذف الاختبار؟ (درجات الطلاب تبقى في الشيت)')) { await api({ action: 'delete', id }); home(); } }

// ---------- محرر الاختبار ----------
const newQ = t => ({ type: t || 'mcq', text: '', image: '', options: t === 'tf' ? ['صح', 'خطأ'] : ['', '', '', ''], answer: 0 });
async function editor(id) {
  EDIT_ID = id || ''; Q = [newQ()]; let t = '', m = 0;
  if (id) {
    const r = await api({ action: 'get', id }); if (r.status !== 'ok') return alert(r.message);
    t = r.exam.title; m = r.exam.minutes; Q = r.exam.questions;
  }
  view(`<div class="row"><h1>${id ? 'تعديل الاختبار' : 'اختبار جديد'}</h1><span class="sp"></span><button class="btn ghost" onclick="home()">رجوع</button></div>
  <div class="card"><input id="t" placeholder="اسم الاختبار" value="${esc(t)}">
  <input id="m" type="number" min="0" placeholder="مدة الاختبار بالدقائق (0 = بدون مؤقت)" value="${m || ''}"></div>
  <div id="qs"></div>
  <div class="row"><button class="btn ghost" onclick="Q.push(newQ('mcq'));draw()">+ اختيار من متعدد</button>
  <button class="btn ghost" onclick="Q.push(newQ('tf'));draw()">+ صح وخطأ</button><span class="sp"></span>
  <button class="btn" id="sv" onclick="save()">💾 حفظ ونشر</button></div><div id="res"></div>`);
  draw();
}
function draw() {
  $('qs').innerHTML = Q.map((q, i) => `<div class="card"><div class="row"><b>سؤال ${i + 1}</b><span class="badge">${q.type === 'tf' ? 'صح وخطأ' : 'اختيار من متعدد'}</span><span class="sp"></span>
  <button class="btn sm ghost" onclick="mv(${i},-1)">▲</button><button class="btn sm ghost" onclick="mv(${i},1)">▼</button>
  <button class="btn sm danger" onclick="Q.splice(${i},1);draw()">حذف</button></div>
  <textarea placeholder="نص السؤال" oninput="Q[${i}].text=this.value">${esc(q.text)}</textarea>
  <input placeholder="رابط صورة للسؤال (اختياري — رابط Drive أو مباشر)" value="${esc(q.image)}" oninput="Q[${i}].image=this.value">
  ${q.type === 'tf'
    ? ['صح', 'خطأ'].map((o, j) => `<div class="opt"><input type="radio" name="a${i}" ${q.answer === j ? 'checked' : ''} onchange="Q[${i}].answer=${j}"> ${o}</div>`).join('')
    : q.options.map((o, j) => `<div class="opt"><input type="radio" name="a${i}" ${q.answer === j ? 'checked' : ''} onchange="Q[${i}].answer=${j}" title="الإجابة الصحيحة">
      <input placeholder="الاختيار ${j + 1}" value="${esc(o)}" oninput="Q[${i}].options[${j}]=this.value">
      ${q.options.length > 2 ? `<button class="btn sm danger" onclick="rmo(${i},${j})">×</button>` : ''}</div>`).join('') +
      (q.options.length < 6 ? `<button class="btn sm ghost" onclick="Q[${i}].options.push('');draw()">+ اختيار</button>` : '') +
      '<div class="muted">حدّد الدائرة بجانب الإجابة الصحيحة</div>'}
  </div>`).join('');
}
function mv(i, d) { const j = i + d; if (j < 0 || j >= Q.length) return; [Q[i], Q[j]] = [Q[j], Q[i]]; draw(); }
function rmo(i, j) { const q = Q[i]; q.options.splice(j, 1); if (q.answer >= q.options.length) q.answer = 0; else if (q.answer > j) q.answer--; draw(); }

async function save() {
  const title = $('t').value.trim(), res = $('res');
  const bad = Q.findIndex(q => !q.text.trim() || (q.type === 'mcq' && q.options.some(o => !o.trim())));
  if (!title) return res.innerHTML = '<div class="msg">اكتب اسم الاختبار</div>';
  if (!Q.length) return res.innerHTML = '<div class="msg">أضف سؤالاً واحداً على الأقل</div>';
  if (bad >= 0) return res.innerHTML = `<div class="msg">أكمل نص السؤال وكل اختياراته (سؤال ${bad + 1})</div>`;
  $('sv').disabled = true; $('sv').textContent = 'جاري الحفظ...';
  const r = await api({ action: 'save', exam: { id: EDIT_ID, title, minutes: +$('m').value || 0, questions: Q } });
  if (r.status !== 'ok') { $('sv').disabled = false; $('sv').textContent = '💾 حفظ ونشر'; return res.innerHTML = `<div class="msg">${esc(r.message)}</div>`; }
  const u = examUrl(r.id);
  view(`<div class="card center"><h2>✅ تم الحفظ</h2><p>رابط الاختبار — ضعه في المنصة:</p>
  <input readonly value="${esc(u)}" onclick="this.select()"><div class="row" style="justify-content:center">
  <button class="btn" onclick="navigator.clipboard.writeText('${u}').then(()=>alert('تم النسخ'))">نسخ الرابط</button>
  <button class="btn ghost" onclick="home()">رجوع للقائمة</button></div></div>`);
}

// ===== صفحة الطالب =====
const qp = new URLSearchParams(location.search), id = qp.get('id');
let phone = qp.get('phone');
if (!phone) { try { phone = (JSON.parse(localStorage.getItem('shafeei_student') || 'null') || {}).phone; } catch (e) {} }
let EX = null, A = [], cur = 0, timer = null, sending = false, CORRECT = null, RES = null;
const MOTIV = ['توكل على الله، أنت تستطيع!', 'ركز جيداً، الإجابة بين يديك.', 'استعن بالله ولا تعجز.', 'اقرأ السؤال بتمعن، ففهم السؤال نصف الإجابة.'];
const LOGO = 'https://drive.google.com/thumbnail?id=11cx_kG09s3PtT70TFoBZ2S8yw_WvIOkD&sz=w500';

function playSound(t) {
  try {
    const C = window.AudioContext || window.webkitAudioContext, c = new C(), o = c.createOscillator(), g = c.createGain(), n = c.currentTime;
    o.connect(g); g.connect(c.destination);
    const cfg = { select: ['sine', 600, 600, .1], next: ['triangle', 400, 600, .15], error: ['sawtooth', 150, 150, .3] }[t];
    o.type = cfg[0]; o.frequency.setValueAtTime(cfg[1], n);
    if (cfg[2] !== cfg[1]) o.frequency.exponentialRampToValueAtTime(cfg[2], n + .1);
    g.gain.setValueAtTime(.1, n); g.gain.exponentialRampToValueAtTime(.001, n + cfg[3]);
    o.start(); o.stop(n + cfg[3]);
  } catch (e) {}
}
function shell(inner, cls) {
  view(`<div class="stu-center"><div class="glass fade-in ${cls || ''}">${inner}</div></div>
  <footer class="stu-foot">Executed by <span>Abdelhalim El-Fakharany</span></footer>`);
}
const logo = `<div class="stu-logo"><img src="${LOGO}" alt="" onerror="this.style.display='none'"></div>`;
const msg = m => shell(`${logo}<div class="stu-msg">${esc(m)}</div>`, 'narrow');
function qimg(u) {
  if (!u) return '';
  const m = u.match(/\/d\/([\w-]+)|[?&]id=([\w-]+)/);
  if (m && /drive\.google/.test(u)) u = 'https://drive.google.com/thumbnail?id=' + (m[1] || m[2]) + '&sz=w1000';
  return `<img class="q-img" src="${esc(u)}" alt="">`;
}

async function init() {
  if (!id) return msg('رابط الاختبار غير صحيح');
  if (!phone) return msg('ادخل إلى الاختبار من داخل المنصة بعد تسجيل الدخول');
  const r = await api({ action: 'getExam', id, phone });
  if (r.status === 'error') return msg(r.message);
  if (r.status === 'taken') return resultView(r.name, r.score, 'لقد أديت هذا الاختبار من قبل');
  EX = r; document.title = r.title;
  shell(`${logo}<h1>منصة الشافعي الصغير</h1><h2>تحت إدارة أ. أبو بكر الشافعي</h2>
  <div class="ex-title">${esc(r.title)}</div>
  <div class="stu-name">الطالب: <b>${esc(r.name)}</b></div>
  <div class="stu-info">ℹ️ ${r.questions.length} سؤال • ${r.minutes ? 'المدة ' + r.minutes + ' دقيقة' : 'بدون مؤقت'} • محاولة واحدة فقط</div>
  <button class="stu-btn gold big" onclick="ready()">ابدأ الاختبار الآن</button>`, 'narrow');
}
function ready() {
  Swal.fire({ title: 'جاهز؟', text: EX.minutes ? 'سيبدأ المؤقت فور دخولك.' : '', icon: 'question', showCancelButton: true, confirmButtonColor: '#10b981', cancelButtonColor: '#ef4444', confirmButtonText: 'نعم، ابدأ', cancelButtonText: 'إلغاء' })
    .then(r => { if (r.isConfirmed) { playSound('next'); start(); } });
}
function start() {
  A = EX.questions.map(() => -1); cur = 0;
  shell(`<div class="q-head"><div class="q-num">السؤال: <b id="qn">1</b> / ${A.length}</div><div class="mot" id="mot"></div>
  ${EX.minutes ? `<div class="tm-wrap"><svg class="tm-svg" viewBox="0 0 100 100"><circle class="tm-bg" cx="50" cy="50" r="45"></circle><circle id="tc" class="tm-fg" cx="50" cy="50" r="45"></circle></svg><div class="tm-txt" id="tt"></div></div>` : ''}</div>
  <div class="q-body" id="qb"><h3 class="q-text" id="qt"></h3><div id="qi"></div><div class="q-opts" id="qo"></div></div>
  <div class="q-foot"><button class="stu-btn gray" id="pv" onclick="prevQ()">السابق</button><span style="flex:1"></span><button class="stu-btn gold" id="nx" onclick="nextQ()">التالي</button></div>`);
  load(0);
  if (EX.minutes) {
    const total = EX.minutes * 60, t0 = Date.now(), tc = $('tc'), tt = $('tt');
    const tick = () => {
      const el = Math.floor((Date.now() - t0) / 1000), rem = Math.max(0, total - el);
      tt.textContent = String(Math.floor(rem / 60)).padStart(2, '0') + ':' + String(rem % 60).padStart(2, '0');
      tc.style.strokeDashoffset = 283 * (el / total);
      if (rem <= 60) { tc.style.stroke = '#ef4444'; tt.classList.add('red'); }
      if (rem <= 0) { clearInterval(timer); playSound('error'); send(true); }
    };
    tick(); timer = setInterval(tick, 1000);
  }
}
function load(i) {
  cur = i; const q = EX.questions[i];
  $('qn').textContent = i + 1; $('mot').textContent = MOTIV[Math.floor(Math.random() * MOTIV.length)];
  $('qt').textContent = q.text; $('qi').innerHTML = qimg(q.image);
  $('qo').innerHTML = q.options.map((o, j) => `<button class="q-opt ${A[i] === j ? 'sel' : ''}" onclick="pick(${j},this)">${esc(o)}</button>`).join('');
  const b = $('qb'); b.classList.remove('fade-in'); void b.offsetWidth; b.classList.add('fade-in');
  $('pv').style.visibility = i === 0 ? 'hidden' : 'visible';
  const last = i === A.length - 1, nx = $('nx');
  nx.textContent = last ? 'إنهاء وتسليم' : 'التالي'; nx.className = 'stu-btn ' + (last ? 'green' : 'gold');
}
function pick(j, el) { playSound('select'); A[cur] = j; [...$('qo').children].forEach(b => b.classList.remove('sel')); el.classList.add('sel'); }
function prevQ() { playSound('next'); if (cur > 0) load(cur - 1); }
function nextQ() {
  if (A[cur] < 0) { playSound('error'); return Swal.fire({ icon: 'warning', title: 'انتظر', text: 'يجب اختيار إجابة قبل الانتقال.', confirmButtonText: 'حسناً', confirmButtonColor: '#eab308' }); }
  if (cur < A.length - 1) { playSound('next'); return load(cur + 1); }
  Swal.fire({ title: 'تسليم الاختبار؟', text: 'لن تستطيع تعديل إجاباتك بعد التسليم.', icon: 'question', showCancelButton: true, confirmButtonColor: '#10b981', cancelButtonColor: '#ef4444', confirmButtonText: 'نعم، سلّم', cancelButtonText: 'رجوع' })
    .then(r => { if (r.isConfirmed) send(false); });
}
async function send(auto) {
  if (sending) return; sending = true; clearInterval(timer);
  shell(`${logo}<div class="ex-title">جاري تسجيل درجتك...</div>`, 'narrow');
  const r = await api({ action: 'submit', id, phone, answers: A });
  if (r.status === 'error') {
    sending = false;
    return shell(`${logo}<div class="stu-msg">${esc(r.message)}</div><button class="stu-btn gold big" onclick="send(true)">إعادة المحاولة</button>`, 'narrow');
  }
  if (r.status === 'taken') return resultView(r.name, r.score, 'تم تسجيل درجتك مسبقاً');
  CORRECT = Array.isArray(r.correct) ? r.correct.map(Number) : null;
  RES = { name: r.name, score: r.score + ' / ' + r.total, title: auto ? 'انتهى الوقت — نتيجتك' : 'نتيجتك النهائية' };
  resultView(RES.name, RES.score, RES.title);
}
function resultView(name, score, title) {
  const p = String(score).match(/(\d+)\s*\/\s*(\d+)/), pct = p ? Math.round(p[1] / p[2] * 100) : 0, ok = pct >= 50;
  shell(`<h1 style="color:${ok ? '#4ade80' : '#f87171'}">${esc(title)}</h1>
  <div class="stu-name">الطالب: <b>${esc(name)}</b></div>
  <div class="res-circle ${ok ? 'ok' : 'no'}"><span id="pc">0%</span></div>
  <div class="ex-title">${esc(score)}</div>
  <p style="font-size:1.3rem;font-weight:700;color:${ok ? '#86efac' : '#fca5a5'}">${ok ? 'عمل رائع ومجهود مميز، استمر في تفوقك يا بطل!' : 'لا تحزن، هذه فرصة للتعلم. راجع دروسك وانطلق من جديد!'}</p>
  <p style="opacity:.75">تم تسجيل درجتك ✅ يمكنك العودة للمنصة.</p>
  ${CORRECT ? `<button class="stu-btn gold big" style="margin-top:1rem" onclick="reviewView(false)">📋 مراجعة إجاباتي</button>` : ''}`, 'narrow');
  playSound(ok ? 'next' : 'error');
  let n = 0; const iv = setInterval(() => { if (n >= pct) { clearInterval(iv); $('pc').textContent = pct + '%'; } else $('pc').textContent = (++n) + '%'; }, 20);
}

// ===== مراجعة الإجابات بعد التسليم =====
function reviewView(all) {
  const items = EX.questions.map((q, i) => ({ q, i, mine: A[i], right: CORRECT[i] }));
  const wrong = items.filter(x => x.mine !== x.right);
  const list = all ? items : wrong;
  const body = list.length ? list.map(x => {
    const ok = x.mine === x.right;
    const opts = x.q.options.map((o, j) => {
      const isRight = j === x.right, isMine = j === x.mine && !isRight;
      return `<div class="rv-opt ${isRight ? 'right' : isMine ? 'wrong' : ''}"><span>${esc(o)}</span>
        ${isRight ? `<span class="rv-tag">✔ الإجابة الصحيحة${j === x.mine ? ' (وهي اختيارك)' : ''}</span>` : ''}
        ${isMine ? '<span class="rv-tag">✘ إجابتك</span>' : ''}</div>`;
    }).join('');
    return `<div class="rv-item ${ok ? 'ok' : 'bad'}">
      <div class="rv-h"><span>سؤال ${x.i + 1}</span><span>${ok ? '✅ صحيحة' : x.mine < 0 ? '⚠️ لم تُجب' : '❌ خاطئة'}</span></div>
      <div class="rv-q">${esc(x.q.text)}</div>${qimg(x.q.image)}${opts}</div>`;
  }).join('') : '<div class="stu-info">🎉 ما شاء الله! أجبت على كل الأسئلة بشكل صحيح.</div>';

  shell(`<h1>مراجعة الإجابات</h1>
    <div class="stu-info">أخطأت في ${wrong.length} من ${items.length} سؤال</div>
    <div class="rv-bar">
      <button class="stu-btn gray" onclick="reviewView(${!all})">${all ? 'عرض الأخطاء فقط' : 'عرض كل الأسئلة'}</button>
      <button class="stu-btn gold" onclick="resultView(RES.name,RES.score,RES.title)">رجوع للنتيجة</button>
    </div>${body}`);
  window.scrollTo(0, 0);
}

// ===== نقطة البداية: برابط فيه id = طالب، وبدونه = لوحة المطور =====
if (id) document.body.classList.add('stu');
id ? init() : (PASS ? home() : loginView());
</script></body></html>
